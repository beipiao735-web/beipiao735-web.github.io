<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>我的免费工具导航 — deal.loc.cc</title>
    <meta name="description" content="个人收藏夹导航：免费 API、AI 对话、API 中转与常用工具，一个页面全找到。" />
    <style>
      * { box-sizing: border-box; }
      :root{
        --bg:#eef3f0; --surface:#ffffff; --surface-2:#f2f6f3;
        --ink:#131c18; --ink-2:#44524b; --ink-3:#718078; --line:#dde3dd;
        --teal:#0c6b57; --teal-deep:#0a4f40;
        --shadow:0 1px 2px rgba(16,40,30,.05),0 4px 14px rgba(16,40,30,.06);
        --shadow-up:0 4px 8px rgba(16,40,30,.07),0 14px 30px rgba(12,80,60,.14);
      }
      @media (prefers-color-scheme: dark){
        :root{ --bg:#0d120f; --surface:#182019; --surface-2:#212d24; --ink:#e8efe9; --ink-2:#b6c4b9; --ink-3:#8ba093; --line:#2b3a2f;
          --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
          --shadow-up:0 4px 8px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.4); }
      }
      body{ margin:0; color:var(--ink); font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        background:
          radial-gradient(900px 420px at 85% -80px, rgba(18,140,100,.14), transparent 60%),
          radial-gradient(700px 380px at -10% 0, rgba(30,110,160,.10), transparent 55%),
          var(--bg);
        background-attachment:fixed; }
      .wrap{ max-width:980px; margin:0 auto; padding:26px 18px 60px; }
      .hero{
        position:relative; overflow:hidden; border-radius:24px; color:#fff;
        padding:34px 30px 28px;
        background:linear-gradient(118deg,#083327 0%,#0a4f40 34%,#0c6b57 62%,#0f7d68 82%,#127a72 100%);
        box-shadow:0 18px 38px rgba(8,60,45,.28);
      }
      .hero::before,.hero::after{ content:""; position:absolute; border-radius:50%; pointer-events:none; }
      .hero::before{ width:340px; height:340px; right:-110px; top:-150px; background:radial-gradient(circle,rgba(255,255,255,.20),transparent 65%); }
      .hero::after{ width:220px; height:220px; right:130px; bottom:-130px; background:radial-gradient(circle,rgba(140,255,210,.16),transparent 65%); }
      .hero h1{ margin:0; font-size:31px; letter-spacing:.5px; position:relative; }
      .hero p{ color:rgba(255,255,255,.86); margin:10px 0 0; line-height:1.65; max-width:640px; position:relative; }
      .stats{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; position:relative; }
      .stats span{
        padding:6px 13px; border-radius:999px; font-size:13px; color:#eafff5;
        background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
        backdrop-filter:blur(4px);
      }
      .search{ margin:22px 0 12px; position:sticky; top:12px; z-index:5; }
      .search .ic-search{
        position:absolute; left:15px; top:50%; transform:translateY(-50%);
        width:19px; height:19px; color:var(--ink-3); pointer-events:none;
      }
      .search input{
        width:100%; padding:14px 16px 14px 44px; font-size:16px; border:1px solid var(--line);
        border-radius:15px; background:var(--surface); color:var(--ink); outline:none;
        box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s;
      }
      .search input:focus{ border-color:var(--teal); box-shadow:0 0 0 4px rgba(12,107,87,.14),var(--shadow); }
      .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 6px; }
      .chips button{
        padding:8px 15px; border:1px solid var(--line); border-radius:999px;
        background:var(--surface); color:var(--ink-2); font-size:14px; cursor:pointer;
        box-shadow:var(--shadow); transition:all .15s;
      }
      .chips button:hover{ border-color:var(--teal); color:var(--teal); transform:translateY(-1px); }
      .chips button.on{ background:linear-gradient(120deg,var(--teal-deep),var(--teal)); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(12,90,70,.3); }
      h2{ font-size:19px; margin:30px 0 13px; display:flex; align-items:center; gap:8px; }
      h2 small{ color:var(--ink-3); font-weight:400; font-size:13px; }
      .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
      .card{
        display:block; padding:16px; border:1px solid var(--line); border-radius:17px;
        background:var(--surface); color:var(--ink); text-decoration:none;
        box-shadow:var(--shadow); transition:transform .16s, box-shadow .16s, border-color .16s;
      }
      .card:hover{ border-color:var(--teal); transform:translateY(-3px); box-shadow:var(--shadow-up); }
      .card .top{ display:flex; align-items:center; gap:12px; }
      .card .ic{
        flex:none; width:48px; height:48px; border-radius:14px;
        background:var(--surface-2); border:1px solid var(--line);
        display:flex; align-items:center; justify-content:center; overflow:hidden;
      }
      .card .ic img{ width:30px; height:30px; object-fit:contain; }
      .card .ic .lt{ font-size:21px; font-weight:700; color:var(--teal); }
      .card .meta{ min-width:0; }
      .card b{ font-size:16px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .card .u{ display:block; font-size:12px; color:var(--ink-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .card .d{ display:block; font-size:13px; color:var(--ink-2); margin-top:11px; line-height:1.55; }
      .hidden{ display:none !important; }
      footer{ margin-top:46px; padding-top:16px; border-top:1px solid var(--line); color:var(--ink-3); font-size:13px; line-height:1.7; }
      footer a{ color:var(--teal); }
      @media (max-width:560px){
        .hero{ padding:26px 20px 22px; border-radius:19px; }
        .hero h1{ font-size:25px; }
        .grid{ grid-template-columns:1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <h1>🧰 我的免费工具导航</h1>
        <p>浏览器收藏夹的网页版：免费 API、AI 对话、API 中转、代充与常用站点都在这。点卡片直达，搜名字也能找。</p>
        <div class="stats"><span>🔗 20 个站点</span><span>🗂 5 个分类</span><span>✨ 持续更新</span></div>
      </header>

      <div class="search">
        <svg class="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
        <input id="q" type="search" placeholder="搜名字，比如 Agnes、Grok、16688…" autocomplete="off" />
      </div>
      <div class="chips" id="chips"></div>
      <main id="main"></main>

      <footer>
        <span>收录于 2026-11-20，链接以各官网最新状态为准。</span><br />
        <span>收藏夹里还有一部分只看得到名字、看不到网址（TokenForge、Models、AI 模型、老王API 里的 BAI / AIHubMix / Radeon 云 / Token Harbor / Y-API / Coarena / 老王导航、工具箱里的临时邮箱 / 接码平台、影视站），发我链接就补进来。</span><br />
        <span>本站部署于 deal.loc.cc。</span>
      </footer>
    </div>

    <script>
      var SITES = [
        /* ---------- 常用 ---------- */
        { name:"GitHub", domain:"github.com", url:"https://github.com", cat:"common",
          desc:"代码仓库与开源项目，找工具、看项目都在这。" },
        { name:"YouTube", domain:"youtube.com", url:"https://www.youtube.com", cat:"common",
          desc:"视频站，教程和直播回放都在这。" },
        { name:"X", domain:"x.com", url:"https://x.com", cat:"common",
          desc:"看 AI 圈动态和新工具首发最快的地方。" },

        /* ---------- 免费 API ---------- */
        { name:"NVIDIA NIM", domain:"build.nvidia.com", url:"https://build.nvidia.com", cat:"api",
          desc:"英伟达官方推理平台，模型阵容最全之一，免费注册领 Key 就能调，兼容 OpenAI 格式。" },
        { name:"Agnes AI", domain:"agnes-ai.com", url:"https://agnes-ai.com", cat:"api",
          desc:"新加坡自研模型的三合一免费 API：文本、图片、视频一个 Key 全调通，Flash 模型目前 $0、不用绑卡。" },
        { name:"硅基流动 SiliconFlow", domain:"siliconflow.cn", url:"https://siliconflow.cn", cat:"api",
          desc:"国产推理云平台，聚合多款主流开源模型，国内直连，站内有专门的免费模型。" },
        { name:"TokenRouter", domain:"tokenrouter.com", url:"https://www.tokenrouter.com", cat:"api",
          desc:"一个 Key 聚合 100+ 模型的 API 中转站，OpenAI / Claude / Gemini 三种格式都能接，站内有 $0 免费模型路线。" },
        { name:"LMSpeed", domain:"lmspeed.net", url:"https://lmspeed.net", cat:"code",
          desc:"免费的 LLM API 比价测速站：100+ 家渠道的价格、速度、可用率放一起比，选 API 中转前先查一眼，免注册。" },
        { name:"Free-LLM 免费 API 目录", domain:"free-llm.com", url:"https://free-llm.com", cat:"code",
          desc:"免费 LLM API 的大目录：40+ 家永久免费档、试用额度按额度、限速、模型列成表，附各家 Key 领取页。" },

        /* ---------- AI 对话 ---------- */
        { name:"ChatGPT", domain:"chatgpt.com", url:"https://chatgpt.com", cat:"chat",
          desc:"免费档能对话、能生图（有限额），综合能力仍是第一梯队。" },
        { name:"豆包", domain:"doubao.com", url:"https://www.doubao.com", cat:"chat",
          desc:"字节的免费对话入口，中文写作和办公场景顺手，国内直连。" },
        { name:"Grok", domain:"grok.com", url:"https://grok.com", cat:"chat",
          desc:"xAI 的对话入口，免费档能对话、联网查实时信息、能生图，X 账号直接登录。" },
        { name:"Arena AI（LMArena）", domain:"lmarena.ai", url:"https://lmarena.ai", cat:"chat",
          desc:"大模型竞技场：两个模型匿名对打、你投票选哪个答得好，免注册免费试用各家前沿模型，还能看公开排行榜。" },
        { name:"Microsoft Copilot", domain:"copilot.microsoft.com", url:"https://copilot.microsoft.com", cat:"chat",
          desc:"微软的免费对话入口，微软账号登录就能用，对话、写东西、联网查资料都行。" },
        { name:"Muse", domain:"claude.ai", url:"https://claude.ai", cat:"chat",
          desc:"Anthropic 的对话入口，免费档能对话、写代码、读文档，写作和长文是强项。" },

        /* ---------- API 中转 ---------- */
        { name:"OpenRouter", domain:"openrouter.ai", url:"https://openrouter.ai", cat:"api",
          desc:"一个 Key 聚合各家模型的「总台」，同一接口切换不同模型，站内带 :free 后缀的模型免费用。" },

        /* ---------- 公益 API（后台直达） ---------- */
        { name:"星驰API公益站", domain:"xingchiapi.com", url:"https://xingchiapi.com/dashboard", cat:"api",
          desc:"公益 API 站，后台直达。仅 gpt-6-astra、gpt-6.1-sol 两个模型、无 Claude；注册后额度为 0，需去 TG 机器人 @xingchi66bot 领兑换码。" },
        { name:"福利站 apikey.casa", domain:"apikey.casa", url:"https://apikey.casa/dashboard", cat:"api",
          desc:"订阅转 API 平台，后台直达。登录后看余额、模型和 Key，额度与模型以站内实时显示为准。" },
        { name:"100milionseek", domain:"100milionseek.top", url:"https://100milionseek.top/dashboard", cat:"api",
          desc:"公益 API 站，后台直达（注意拼写：milion 少一个 l）。2026-11-20 站方公告：新注册暂停、部分请求失败、正在扩容，以站内为准。" },

        /* ---------- 代充 ---------- */
        { name:"16688", domain:"16688.com.cn", url:"https://16688.com.cn", cat:"topup",
          desc:"代充平台首页；我的小店「ai代理」也在上面，Muse 邀请助力与 GPT Codex Plus 充值套餐在售。" }
      ];

      var CATS = [
        { id:"all", label:"全部", ic:"🌐" },
        { id:"common", label:"常用", ic:"⭐" },
        { id:"api", label:"免费 API", ic:"🔑" },
        { id:"chat", label:"AI 对话", ic:"💬" },
        { id:"code", label:"工具 / 目录", ic:"🧭" },
        { id:"topup", label:"代充", ic:"💳" }
      ];
      var state = { cat:"all", q:"" };

      function render(){
        var chips = document.getElementById("chips");
        chips.innerHTML = "";
        CATS.forEach(function(c){
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = (c.ic ? c.ic + " " : "") + c.label + (c.id === "all" ? "（" + SITES.length + "）" : "");
          if (state.cat === c.id) b.className = "on";
          b.onclick = function(){ state.cat = c.id; render(); };
          chips.appendChild(b);
        });

        var main = document.getElementById("main");
        main.innerHTML = "";
        var q = state.q.trim().toLowerCase();
        CATS.filter(function(c){ return c.id !== "all"; }).forEach(function(c){
          var list = SITES.filter(function(s){
            if (s.cat !== c.id) return false;
            if (state.cat !== "all" && state.cat !== c.id) return false;
            if (q && (s.name + s.domain + s.desc).toLowerCase().indexOf(q) === -1) return false;
            return true;
          });
          if (!list.length) return;
          var h = document.createElement("h2");
          h.innerHTML = (c.ic ? c.ic + " " : "") + c.label + "<small>" + list.length + " 个</small>";
          main.appendChild(h);
          var g = document.createElement("div");
          g.className = "grid";
          list.forEach(function(s){
            var a = document.createElement("a");
            a.className = "card";
            a.href = s.url;
            a.target = "_blank";
            a.rel = "noopener";
            var top = document.createElement("div");
            top.className = "top";
            var ic = document.createElement("span");
            ic.className = "ic";
            var img = document.createElement("img");
            img.alt = "";
            img.loading = "lazy";
            img.src = "https://icons.duckduckgo.com/ip3/" + s.domain + ".ico";
            img.onerror = function(){
              if (!img.dataset.f) {
                img.dataset.f = "1";
                img.src = "https://www.google.com/s2/favicons?domain=" + s.domain + "&sz=128";
              } else {
                img.style.display = "none";
                var lt = document.createElement("span");
                lt.className = "lt";
                lt.textContent = s.name.charAt(0);
                ic.appendChild(lt);
              }
            };
            ic.appendChild(img);
            var meta = document.createElement("span");
            meta.className = "meta";
            var b = document.createElement("b");
            b.textContent = s.name;
            var u = document.createElement("span");
            u.className = "u";
            u.textContent = s.domain;
            meta.appendChild(b); meta.appendChild(u);
            top.appendChild(ic); top.appendChild(meta);
            var d = document.createElement("span");
            d.className = "d";
            d.textContent = s.desc;
            a.appendChild(top); a.appendChild(d);
            g.appendChild(a);
          });
          main.appendChild(g);
        });
        if (!main.children.length){
          var p = document.createElement("p");
          p.textContent = "没找到，换个关键词试试。";
          main.appendChild(p);
        }
      }

      document.getElementById("q").addEventListener("input", function(e){
        state.q = e.target.value;
        render();
      });
      render();
    </script>
  </body>
</html>
